name: SkiVideoViewer
options:
  bundleIdPrefix: ch.ski
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SkiVideoCore:
    path: .

targets:
  SkiVideoViewer-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/SkiVideoViewer/Shared
      - path: Sources/SkiVideoViewer/macOS
    dependencies:
      - package: SkiVideoCore
        product: SkiVideoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ski.video-viewer
        PRODUCT_NAME: SkiVideoViewer
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false

  SkiVideoViewer-iPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # ComparisonView depends on OverlayPlayerView, which is an
      # NSViewRepresentable in macOS/. Compare reaches iPad in phase 5, which
      # supplies a UIKit overlay view; until then the iPad target cannot
      # compile this file and nothing on iPad reaches it
      # (NoSecondaryScreenPresenter.canPresent == false).
      - path: Sources/SkiVideoViewer/Shared
        excludes:
          - ComparisonView.swift
      - path: Sources/SkiVideoViewer/iOS
    dependencies:
      - package: SkiVideoCore
        product: SkiVideoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ski.video-viewer.ipad
        PRODUCT_NAME: SkiVideoViewer
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: true
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: false
