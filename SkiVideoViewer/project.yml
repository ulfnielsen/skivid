name: SkiVideoViewer
options:
  bundleIdPrefix: dk.dyregod
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SkiVideoCore:
    path: .

targets:
  SkiVideoViewer-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/SkiVideoViewer/Shared
      - path: Sources/SkiVideoViewer/macOS
    dependencies:
      - package: SkiVideoCore
        product: SkiVideoCore
    settings:
      base:
        # Deliberately NOT dk.dyregod.video-viewer, which belongs to the shipping
        # hand-assembled AppBundle/ (CFBundleVersion 7, built by build_app.sh).
        # Building this target runs lsregister over the derived-data bundle, so
        # sharing the identifier registered a competing, higher-versioned,
        # icon-less "SkiVideoViewer" that `open -b`, the Dock and Open With
        # could resolve to instead of the real app. Take the shipping
        # identifier only when this target becomes the shipping path.
        PRODUCT_BUNDLE_IDENTIFIER: dk.dyregod.video-viewer.xcode
        PRODUCT_NAME: SkiVideoViewer
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false

  SkiVideoViewer-iPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Shared/ compiles on both platforms with no exclusions — that is the
      # invariant the directory name promises. ComparisonView lives there and
      # compiles for iPad, overlay included: OverlayPlayerStack renders it in
      # SwiftUI on both platforms, so Shared/ references no macOS/ type.
      # IOSSecondaryScreenPresenter reports canPresentComparison == true, so
      # the toolbar's Compare button opens it as a full-screen cover.
      - path: Sources/SkiVideoViewer/Shared
      - path: Sources/SkiVideoViewer/iOS
      # The app icon. iOS will not take one from a loose PNG the way
      # AppBundle/Info.plist's CFBundleIconFile does on the Mac — it has to
      # come out of a compiled asset catalog — so this exists for the iPad
      # alone and holds the same artwork.
      - path: iPad-Assets.xcassets
    dependencies:
      - package: SkiVideoCore
        product: SkiVideoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dyregod.video-viewer.ipad
        # Named here rather than passed on the command line, so installing on
        # the iPad is `xcodebuild ... build` and not a line somebody has to
        # remember. The simulator never needed it; a real device does.
        DEVELOPMENT_TEAM: "9LTFHV87LB"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: SkiVideoViewer
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        # Partial plist merged into the generated one. It carries
        # UIFileSharingEnabled, which has no INFOPLIST_KEY_* equivalent —
        # Xcode only honours the INFOPLIST_KEY_ names in
        # CoreBuildSystem.xcspec, and that one is absent, so setting it here
        # reached the build settings but never the built plist.
        INFOPLIST_FILE: iPad-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
        # Signed for the Keychain, not for distribution. iOS gates Keychain
        # access behind the `application-identifier` entitlement, and only
        # code signing grants it — so with signing off, Google sign-in
        # completes, exchanges the code, and then cannot store the refresh
        # token: SecItemAdd returns errSecMissingEntitlement (-34018) and the
        # coach is told to sign in again, forever. This target used to set
        # CODE_SIGNING_ALLOWED: false, which is why.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9LTFHV87LB
    # Declared here so xcodegen writes a *shared* scheme with the UI tests
    # attached. Without it xcodebuild autocreates a scheme that builds but
    # cannot `test`, and `xcodebuild test -scheme SkiVideoViewer-iPad` finds
    # nothing to run.
    scheme:
      testTargets:
        - SkiVideoViewer-iPadUITests

  # The only check in this repo that drives the iPad UI. simctl has no input
  # injection, so a tap on the Compare button can only come from XCUITest.
  SkiVideoViewer-iPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SkiVideoViewerUITests
    dependencies:
      - target: SkiVideoViewer-iPad
      # Linked so ClipPlayabilityOnIOSTests can call the real
      # ClipPlayability against real files. The question it answers —
      # "does *this* device's decoder accept 10-bit 4:4:4 H.264?" — has a
      # different answer on macOS, where the SwiftPM suites run, so it
      # cannot be asked there.
      - package: SkiVideoCore
        product: SkiVideoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dyregod.video-viewer.ipad.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: SkiVideoViewer-iPad
        # Matches the app target's signing. A signed app under test cannot be
        # launched by an unsigned runner, and the app must be signed at all
        # because iOS grants Keychain access only through an entitlement.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9LTFHV87LB
